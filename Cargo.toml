[package]
name = "webtop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Kelvinlby/webtop"

[dependencies]
axum = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
if-addrs = "0.15.0"
ipnet = "2.12.2"
nvml-wrapper = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sysinfo = "0.37"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
