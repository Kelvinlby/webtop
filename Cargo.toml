[package]
name = "webtop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Kelvinlby/webtop"

[dependencies]
axum = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
if-addrs = "0.15.0"
ipnet = "2.12.2"
nvml-wrapper = "0.12"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sysinfo = "0.37"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
