<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>webtop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Material 3 tokens (baseline scheme) ---------- */
:root{
  color-scheme:light;
  --md-primary:#6750a4;--md-on-primary:#fff;
  --md-secondary-container:#e8def8;--md-on-secondary-container:#1d192b;
  --md-surface:#fef7ff;--md-surface-c-lowest:#fff;--md-surface-c-low:#f7f2fa;--md-surface-c:#f3edf7;--md-surface-c-high:#ece6f0;--md-surface-c-highest:#e6e0e9;
  --md-on-surface:#1d1b20;--md-on-surface-variant:#49454f;
  --md-outline:#79747e;--md-outline-variant:#cac4d0;
  --md-error:#b3261e;
  --md-inverse-surface:#322f35;--md-inverse-on-surface:#f5eff7;
  /* data series (validated categorical slots, light steps) */
  --c-cpu:#2a78d6;--c-ram:#1baf7a;--c-swap:#eb6834;--c-sm:#4a3aa7;--c-ten:#eb6834;--c-vram:#e87ba4;--c-pw:#eda100;
  --grid:rgba(73,69,79,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --md-primary:#d0bcff;--md-on-primary:#381e72;
  --md-secondary-container:#4a4458;--md-on-secondary-container:#e8def8;
  --md-surface:#141218;--md-surface-c-lowest:#0f0d13;--md-surface-c-low:#1d1b20;--md-surface-c:#211f26;--md-surface-c-high:#2b2930;--md-surface-c-highest:#36343b;
  --md-on-surface:#e6e0e9;--md-on-surface-variant:#cac4d0;
  --md-outline:#938f99;--md-outline-variant:#49454f;
  --md-error:#f2b8b5;
  --md-inverse-surface:#e6e0e9;--md-inverse-on-surface:#322f35;
  --c-cpu:#3987e5;--c-ram:#199e70;--c-swap:#d95926;--c-sm:#9085e9;--c-ten:#d95926;--c-vram:#d55181;--c-pw:#c98500;
  --grid:rgba(202,196,208,.12);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --md-primary:#d0bcff;--md-on-primary:#381e72;
  --md-secondary-container:#4a4458;--md-on-secondary-container:#e8def8;
  --md-surface:#141218;--md-surface-c-lowest:#0f0d13;--md-surface-c-low:#1d1b20;--md-surface-c:#211f26;--md-surface-c-high:#2b2930;--md-surface-c-highest:#36343b;
  --md-on-surface:#e6e0e9;--md-on-surface-variant:#cac4d0;
  --md-outline:#938f99;--md-outline-variant:#49454f;
  --md-error:#f2b8b5;
  --md-inverse-surface:#e6e0e9;--md-inverse-on-surface:#322f35;
  --c-cpu:#3987e5;--c-ram:#199e70;--c-swap:#d95926;--c-sm:#9085e9;--c-ten:#d95926;--c-vram:#d55181;--c-pw:#c98500;
  --grid:rgba(202,196,208,.12);
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--md-surface);color:var(--md-on-surface);font:400 14px/20px "Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.016em;-webkit-font-smoothing:antialiased}
.mono,td,.num{font-family:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- Top app bar ---------- */
.appbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 24px;background:var(--md-surface-c);border-bottom:1px solid var(--md-outline-variant)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.logo{width:40px;height:40px;border-radius:12px;background:var(--md-primary);color:var(--md-on-primary);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-size:22px;line-height:28px;font-weight:500;letter-spacing:0;white-space:nowrap}
.brand p{margin:0;font-size:12px;line-height:16px;color:var(--md-on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{width:8px;height:8px;border-radius:50%;background:var(--c-ram);display:inline-block;margin-right:6px;vertical-align:middle}
.status.off{background:var(--md-error)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.ctl-label{font-size:12px;font-weight:500;color:var(--md-on-surface-variant);letter-spacing:.04em;margin-right:-4px}

/* Segmented button */
.seg{display:inline-flex;border:1px solid var(--md-outline);border-radius:20px;overflow:hidden;height:40px}
.seg button{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:14px;font-weight:500;letter-spacing:.01em;color:var(--md-on-surface);border-left:1px solid var(--md-outline);position:relative}
.seg button:first-child{border-left:0}
.seg button:hover::after,.iconbtn:hover::after,.chip:hover::after{content:"";position:absolute;inset:0;background:currentColor;opacity:.08;border-radius:inherit}
.seg button:focus-visible,.iconbtn:focus-visible,.chip:focus-visible{outline:3px solid var(--md-primary);outline-offset:-3px}
.seg button[aria-pressed="true"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.seg button .ck{display:none;width:18px;height:18px}
.seg button[aria-pressed="true"] .ck{display:block}
.iconbtn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--md-on-surface-variant);position:relative}
.iconbtn[aria-pressed="true"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}

/* ---------- Layout ---------- */
main{padding:16px 24px 32px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-cpu{grid-column:span 8}.span-mem{grid-column:span 4}.span-g{grid-column:span 3}.span-full{grid-column:1/-1}
@media (max-width:1500px){.span-g{grid-column:span 6}}
@media (max-width:1100px){.span-cpu{grid-column:span 7}.span-mem{grid-column:span 5}}
@media (max-width:820px){.span-cpu,.span-mem,.span-g{grid-column:1/-1}main,.appbar{padding-left:16px;padding-right:16px}}

.section-h{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0 -4px}
.section-h h2{margin:0;font-size:16px;line-height:24px;font-weight:500;letter-spacing:.009em}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--md-outline-variant);border-radius:8px;font-size:14px;font-weight:500;color:var(--md-on-surface-variant);position:relative}
.chip b{color:var(--md-on-surface);font-weight:500}

/* ---------- Cards ---------- */
.card{background:var(--md-surface-c-low);border-radius:16px;padding:16px 20px 16px;display:flex;flex-direction:column;min-width:0;border:1px solid var(--md-outline-variant)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-h .t{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.009em}
.card-h .s{font-size:12px;line-height:16px;color:var(--md-on-surface-variant);margin-top:2px;min-height:16px}
.big{font-size:36px;line-height:44px;font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:16px;color:var(--md-on-surface-variant);margin-left:2px}
.na{color:var(--md-on-surface-variant)}
.chart{position:relative;flex:1;min-height:220px;margin-top:12px}
.chart.tall{min-height:280px}
.chart canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.legend{display:flex;gap:16px;font-size:12px;color:var(--md-on-surface-variant);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:4px;margin-top:14px}
.core{height:40px;border-radius:6px;background:var(--md-surface-c-highest);position:relative;overflow:hidden}
.core b{position:absolute;left:0;right:0;bottom:0;background:var(--c-cpu);border-radius:4px 4px 0 0;transition:height .25s}
.core span{position:absolute;left:0;right:0;top:3px;text-align:center;font-size:10px;line-height:12px;color:var(--md-on-surface-variant);font-family:"Roboto Mono",monospace}

.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kv div{background:var(--md-surface-c-high);border-radius:12px;padding:8px 12px}
.kv dt{font-size:12px;line-height:16px;color:var(--md-on-surface-variant)}
.kv dd{margin:0;font-size:16px;line-height:24px;font-weight:500}

/* ---------- Processes ---------- */
.ptools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:4px 0 12px}
.search{flex:1;min-width:220px;max-width:640px;display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:24px;background:var(--md-surface-c-high);color:var(--md-on-surface-variant)}
.search input{all:unset;flex:1;color:var(--md-on-surface);font-size:16px}
.search input::placeholder{color:var(--md-on-surface-variant)}
.chip.filter{cursor:pointer;user-select:none;appearance:none;background:none;font:inherit;font-size:14px;font-weight:500}
.chip.filter[aria-pressed="true"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-color:transparent}
.chip.filter .ck{display:none;width:18px;height:18px}
.chip.filter[aria-pressed="true"] .ck{display:block}
.pcount{margin-left:auto;font-size:12px;color:var(--md-on-surface-variant)}
.tw{overflow:auto;max-height:72vh;border-radius:12px;border:1px solid var(--md-outline-variant);background:var(--md-surface-c-lowest)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:0 12px;height:36px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--md-outline-variant)}
th{position:sticky;top:0;z-index:1;height:44px;background:var(--md-surface-c-high);color:var(--md-on-surface-variant);font-family:"Roboto Flex",Roboto,system-ui,sans-serif;font-weight:500;font-size:13px;cursor:pointer;user-select:none}
th:hover{color:var(--md-on-surface)}
th.s{color:var(--md-primary)}
th.s::after{content:"↓";margin-left:4px}th.s.asc::after{content:"↑"}
th.l,td.l{text-align:left}
td.cmd{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;color:var(--md-on-surface-variant)}
tbody tr:hover td{background:var(--md-surface-c)}
tbody tr:last-child td{border-bottom:0}
.bar{display:inline-block;width:44px;height:6px;border-radius:3px;background:var(--md-surface-c-highest);margin-right:8px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
@media (max-width:820px){.hide-sm{display:none}}

/* ---------- Tooltip (MD3 plain tooltip) ---------- */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);border-radius:8px;padding:8px 12px;font-size:12px;line-height:16px;box-shadow:0 2px 6px rgba(0,0,0,.25);display:none;min-width:120px}
#tip .tt{opacity:.75;margin-bottom:4px}
#tip .row{display:flex;align-items:center;gap:8px}
#tip .row i{width:12px;height:3px;border-radius:2px}
#tip .row b{font-size:14px;font-weight:600;font-family:"Roboto Mono",monospace}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v7H3zm4-6h2v13H7zm4 3h2v10h-2zm4-7h2v17h-2zm4 9h2v8h-2z"/></svg></div>
    <div style="min-width:0">
      <h1><span class="status" id="dot"></span><span id="host">webtop</span></h1>
      <p id="sub">connecting…</p>
    </div>
  </div>
  <div class="controls">
    <span class="ctl-label">UPDATE</span>
    <div class="seg" id="rate" role="group" aria-label="Update interval"></div>
    <span class="ctl-label">WINDOW</span>
    <div class="seg" id="win" role="group" aria-label="Chart time window"></div>
    <button class="iconbtn" id="pause" aria-pressed="false" title="Pause updates" aria-label="Pause updates">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path id="pauseico" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <button class="iconbtn" id="theme" title="Theme: auto" aria-label="Toggle theme">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20zm0-2V4a8 8 0 0 0 0 16z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="grid" id="grid">
    <section class="card span-cpu">
      <div class="card-h">
        <div><div class="t">CPU</div><div class="s" id="cpusub"></div></div>
        <div class="big" id="cpuv">–</div>
      </div>
      <div class="chart tall"><canvas id="c-cpu"></canvas></div>
      <div class="cores" id="cores"></div>
    </section>

    <section class="card span-mem">
      <div class="card-h">
        <div><div class="t">Memory</div><div class="s" id="memsub"></div></div>
        <div class="big" id="memv">–</div>
      </div>
      <div class="chart tall"><canvas id="c-mem"></canvas></div>
      <div class="legend"><span><i style="background:var(--c-ram)"></i>RAM</span><span id="swaplg"><i style="background:var(--c-swap)"></i>Swap</span></div>
      <dl class="kv">
        <div><dt>Used</dt><dd class="num" id="m-used">–</dd></div>
        <div><dt>Available</dt><dd class="num" id="m-avail">–</dd></div>
        <div><dt>Swap</dt><dd class="num" id="m-swap">–</dd></div>
      </dl>
    </section>

    <div id="gpu-anchor" style="display:none"></div>

    <div class="section-h"><h2>Processes</h2></div>
    <section class="card span-full">
      <div class="ptools">
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
          <input type="search" id="q" placeholder="Search name, user, PID or command" autocomplete="off">
        </label>
        <button class="chip filter" id="gpuonly" aria-pressed="false">
          <svg class="ck" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>GPU processes
        </button>
        <span class="pcount" id="pcount"></span>
      </div>
      <div class="tw"><table>
        <thead><tr>
          <th data-k="pid">PID</th><th data-k="user" class="l">User</th><th data-k="name" class="l">Name</th>
          <th data-k="cpu">CPU %</th><th data-k="mem">Memory</th><th data-k="vram">VRAM</th><th data-k="gpu">GPU SM %</th>
          <th data-k="status" class="l hide-sm">State</th><th data-k="cmd" class="l hide-sm">Command</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table></div>
    </section>
  </div>
</main>
<div id="tip"></div>

<script>
"use strict";
const DEFAULT_RATE = __INTERVAL__;
const RATES = [250, 500, 1000, 2000, 5000];
const WINDOWS = [[60, '1m'], [300, '5m'], [900, '15m']];
const KEEP_MS = 900e3, MAXROWS = 500;
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('webtop.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('webtop.' + k, JSON.stringify(v)); } catch {} },
};
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtB(b){ if (b == null) return '–'; const u = ['B','KiB','MiB','GiB','TiB']; let i = 0; while (b >= 1024 && i < 4){ b /= 1024; i++; } return (i ? b.toFixed(b < 10 ? 2 : b < 100 ? 1 : 0) : b) + ' ' + u[i]; }
const pct = v => v == null ? '–' : (v < 10 ? v.toFixed(1) : v.toFixed(0)) + '%';
const fmtRate = ms => ms < 1000 ? ms + ' ms' : ms / 1000 + ' s';
function fmtUp(s){ const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return `up ${d ? d + 'd ' : ''}${h}h ${m}m`; }

/* ---------- state ---------- */
let rate = store.get('rate', DEFAULT_RATE); if (!RATES.includes(rate)) rate = 1000;
let win = store.get('win', 300); if (!WINDOWS.some(w => w[0] === win)) win = 300;
let theme = store.get('theme', 'auto');
let paused = false, last = null, lastTs = 0, lastOk = 0, timer = null;
const H = []; // {t, v:{key:value}}

/* ---------- controls ---------- */
const CHECK = '<svg class="ck" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
function segmented(el, items, get, set){
  el.innerHTML = '';
  for (const [val, label] of items){
    const b = document.createElement('button');
    b.innerHTML = CHECK; b.append(label);
    b.onclick = () => { set(val); paint(); };
    b.dataset.v = val; el.append(b);
  }
  const paint = () => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === get())));
  paint();
}
segmented($('rate'), RATES.map(r => [r, fmtRate(r)]), () => rate, v => { rate = v; store.set('rate', v); restart(); });
segmented($('win'), WINDOWS, () => win, v => { win = v; store.set('win', v); drawAll(); });
$('pause').onclick = () => {
  paused = !paused;
  $('pause').setAttribute('aria-pressed', String(paused));
  $('pauseico').setAttribute('d', paused ? 'M8 5v14l11-7z' : 'M6 5h4v14H6zm8 0h4v14h-4z');
  $('pause').title = paused ? 'Resume updates' : 'Pause updates';
  if (!paused) restart();
};
function applyTheme(){
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = theme;
  $('theme').title = 'Theme: ' + theme;
  drawAll(); paintCores();
}
$('theme').onclick = () => { theme = {auto:'light', light:'dark', dark:'auto'}[theme]; store.set('theme', theme); applyTheme(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { drawAll(); });

/* ---------- time-series chart ---------- */
const charts = [];
const tip = $('tip');
class Chart {
  // series: [{key, color(css var), label}], max: number|()=>number, fmt: v=>string, yfmt: v=>string
  constructor(canvas, opt){
    Object.assign(this, opt); this.cv = canvas; this.hoverX = null;
    canvas.addEventListener('pointermove', e => { this.hoverX = e.offsetX; this.draw(); this.tip(e); });
    canvas.addEventListener('pointerleave', () => { this.hoverX = null; tip.style.display = 'none'; this.draw(); });
    new ResizeObserver(() => this.draw()).observe(canvas.parentElement);
    charts.push(this);
  }
  geom(){
    const w = this.cv.clientWidth, h = this.cv.clientHeight;
    return {w, h, l: 44, r: 8, t: 8, b: 22, pw: w - 52, ph: h - 30};
  }
  draw(){
    const cv = this.cv, dpr = devicePixelRatio || 1, g = this.geom();
    if (!g.w || !g.h) return;
    if (cv.width !== Math.round(g.w * dpr) || cv.height !== Math.round(g.h * dpr)){ cv.width = Math.round(g.w * dpr); cv.height = Math.round(g.h * dpr); }
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, g.w, g.h);
    const max = (typeof this.max === 'function' ? this.max() : this.max) || 100;
    const now = last ? last.ts : Date.now(), t0 = now - win * 1000;
    const X = t => g.l + (t - t0) / (win * 1000) * g.pw;
    const Y = v => g.t + g.ph - Math.max(0, Math.min(max, v)) / max * g.ph;
    const muted = tok('--md-on-surface-variant');
    c.font = '11px "Roboto Mono", monospace'; c.fillStyle = muted; c.textBaseline = 'middle';
    // grid + y labels
    c.strokeStyle = tok('--grid'); c.lineWidth = 1;
    for (let i = 0; i <= 4; i++){
      const v = max * i / 4, y = Math.round(Y(v)) + .5;
      c.beginPath(); c.moveTo(g.l, y); c.lineTo(g.l + g.pw, y); c.stroke();
      if (i % 2 === 0){ c.textAlign = 'right'; c.fillText(this.yfmt(v), g.l - 8, y); }
    }
    // x labels
    c.textBaseline = 'alphabetic';
    const lbl = s => s >= 60 ? `−${s / 60}m` : `−${s}s`;
    c.textAlign = 'left'; c.fillText(lbl(win), g.l, g.h - 4);
    c.textAlign = 'center'; c.fillText(lbl(win / 2), g.l + g.pw / 2, g.h - 4);
    c.textAlign = 'right'; c.fillText('now', g.l + g.pw, g.h - 4);
    // series
    let lo = 0; while (lo < H.length && H[lo].t < t0 - 5000) lo++;
    const pts = H.slice(lo);
    c.save(); c.beginPath(); c.rect(g.l, g.t - 2, g.pw, g.ph + 4); c.clip();
    for (const s of this.series){
      const col = tok(s.color);
      // split into segments at gaps (paused tab, server idle)
      const segs = []; let cur = [];
      for (let i = 0; i < pts.length; i++){
        const v = pts[i].v[s.key];
        if (v == null || (i && pts[i].t - pts[i - 1].t > Math.max(3 * pts[i].iv, 3000))){ if (cur.length) segs.push(cur); cur = []; }
        if (v != null) cur.push([X(pts[i].t), Y(v)]);
      }
      if (cur.length) segs.push(cur);
      for (const seg of segs){
        if (seg.length < 2) continue;
        c.beginPath(); c.moveTo(seg[0][0], g.t + g.ph);
        for (const [x, y] of seg) c.lineTo(x, y);
        c.lineTo(seg[seg.length - 1][0], g.t + g.ph); c.closePath();
        c.globalAlpha = .16; c.fillStyle = col; c.fill(); c.globalAlpha = 1;
        c.beginPath(); seg.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
        c.strokeStyle = col; c.lineWidth = 2; c.lineJoin = 'round'; c.stroke();
      }
    }
    c.restore();
    // crosshair
    this.hit = null;
    if (this.hoverX != null && pts.length){
      const t = t0 + (this.hoverX - g.l) / g.pw * win * 1000;
      let best = null, bd = Infinity;
      for (const p of pts){ const d = Math.abs(p.t - t); if (d < bd){ bd = d; best = p; } }
      if (best && best.t >= t0){
        const x = Math.round(X(best.t)) + .5;
        c.strokeStyle = muted; c.globalAlpha = .6; c.lineWidth = 1;
        c.beginPath(); c.moveTo(x, g.t); c.lineTo(x, g.t + g.ph); c.stroke(); c.globalAlpha = 1;
        for (const s of this.series){
          const v = best.v[s.key]; if (v == null) continue;
          c.beginPath(); c.arc(x, Y(v), 4.5, 0, 7); c.fillStyle = tok(s.color); c.fill();
          c.lineWidth = 2; c.strokeStyle = tok('--md-surface-c-low'); c.stroke();
        }
        this.hit = best;
      }
    }
  }
  tip(e){
    if (!this.hit){ tip.style.display = 'none'; return; }
    const p = this.hit; tip.textContent = '';
    const tt = document.createElement('div'); tt.className = 'tt';
    tt.textContent = `${new Date(p.t).toLocaleTimeString()} · ${Math.round((last.ts - p.t) / 1000)}s ago`;
    tip.append(tt);
    for (const s of this.series){
      const v = p.v[s.key]; if (v == null) continue;
      const r = document.createElement('div'); r.className = 'row';
      const i = document.createElement('i'); i.style.background = tok(s.color);
      const b = document.createElement('b'); b.textContent = this.fmt(v, p, s);
      const l = document.createElement('span'); l.textContent = s.label;
      r.append(i, b, l); tip.append(r);
    }
    tip.style.display = 'block';
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY - th - 10;
    if (x + tw > innerWidth - 8) x = e.clientX - tw - 14;
    if (y < 8) y = e.clientY + 16;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
}
function drawAll(){ charts.forEach(c => c.draw()); }

const pctFmt = v => pct(v);
new Chart($('c-cpu'), {series: [{key: 'cpu', color: '--c-cpu', label: 'CPU'}], max: 100, fmt: pctFmt, yfmt: v => v + '%'});
new Chart($('c-mem'), {series: [{key: 'mem', color: '--c-ram', label: 'RAM'}, {key: 'swap', color: '--c-swap', label: 'Swap'}], max: 100,
  fmt: (v, p, s) => `${pct(v)} · ${fmtB(p.v[s.key + 'B'])}`, yfmt: v => v + '%'});

/* ---------- GPU sections ---------- */
const gpuEls = {};
function gpuSection(gp){
  const k = 'g' + gp.index;
  if (gpuEls[k]) return gpuEls[k];
  const anchor = $('gpu-anchor'), frag = document.createElement('template');
  frag.innerHTML = `
  <div class="section-h"><h2>GPU ${gp.index} · <span data-f="name"></span></h2>
    <span class="chip">Temp <b class="num" data-f="temp">–</b></span>
    <span class="chip">Power <b class="num" data-f="pwr">–</b></span>
    <span class="chip">SM clock <b class="num" data-f="clk">–</b></span>
    <span class="chip">Mem BW <b class="num" data-f="bw">–</b></span>
  </div>
  ${[['sm', 'SM activity', 'smsub'], ['ten', 'Tensor cores', 'tensub'], ['vr', 'VRAM', 'vrsub'], ['pw', 'Power', 'pwsub']].map(([id, t, sub]) => `
  <section class="card span-g">
    <div class="card-h"><div><div class="t">${t}</div><div class="s" data-f="${sub}"></div></div><div class="big" data-f="${id}">–</div></div>
    <div class="chart"><canvas data-c="${id}"></canvas></div>
  </section>`).join('')}`;
  const nodes = [...frag.content.children];
  nodes.forEach(n => anchor.before(n));
  const f = n => nodes.map(x => x.querySelector(`[data-f="${n}"]`)).find(Boolean);
  const cv = n => nodes.map(x => x.querySelector(`[data-c="${n}"]`)).find(Boolean);
  const el = {f};
  new Chart(cv('sm'), {series: [{key: k + 'sm', color: '--c-sm', label: 'SM'}], max: 100, fmt: pctFmt, yfmt: v => v + '%'});
  new Chart(cv('ten'), {series: [{key: k + 'ten', color: '--c-ten', label: 'Tensor'}], max: 100, fmt: pctFmt, yfmt: v => v + '%'});
  new Chart(cv('vr'), {series: [{key: k + 'vr', color: '--c-vram', label: 'VRAM'}], max: 100,
    fmt: (v, p) => `${pct(v)} · ${fmtB(p.v[k + 'vrB'])}`, yfmt: v => v + '%'});
  new Chart(cv('pw'), {series: [{key: k + 'pw', color: '--c-pw', label: 'Power'}],
    max: () => { const g = last && last.gpus.find(x => x.index === gp.index); return g && g.power_limit_w ? g.power_limit_w : 300; },
    fmt: v => v.toFixed(0) + ' W', yfmt: v => v.toFixed(0) + 'W'});
  return gpuEls[k] = el;
}
function renderGpu(gp){
  const el = gpuSection(gp), f = el.f;
  const vp = gp.vram_total ? gp.vram_used / gp.vram_total * 100 : 0;
  f('name').textContent = gp.name;
  f('temp').textContent = gp.temp_c != null ? gp.temp_c + ' °C' : '–';
  f('pwr').textContent = gp.power_w != null ? `${gp.power_w.toFixed(0)} / ${gp.power_limit_w ? gp.power_limit_w.toFixed(0) : '?'} W` : '–';
  f('clk').textContent = gp.sm_clock_mhz ? gp.sm_clock_mhz + ' MHz' : '–';
  f('bw').textContent = pct(gp.mem_bw);
  f('sm').textContent = pct(gp.sm);
  f('smsub').textContent = gp.sm_source === 'gpm' ? 'SMs busy (GPM)' : gp.sm_source === 'nvml' ? 'Kernel-busy time (NVML)' : '';
  f('ten').textContent = pct(gp.tensor); f('ten').classList.toggle('na', gp.tensor == null);
  f('tensub').textContent = gp.tensor == null ? 'Requires GPM (Hopper or newer)' : 'Any tensor pipe active';
  f('vr').textContent = pct(vp);
  f('vrsub').textContent = `${fmtB(gp.vram_used)} of ${fmtB(gp.vram_total)}`;
  f('pw').innerHTML = gp.power_w != null ? `${gp.power_w.toFixed(0)}<small>W</small>` : '–';
  f('pwsub').textContent = gp.power_limit_w ? `Limit ${gp.power_limit_w.toFixed(0)} W` + (gp.temp_c != null ? ` · ${gp.temp_c} °C` : '') : '';
}

/* ---------- CPU cores ---------- */
function paintCores(){
  if (!last) return;
  const el = $('cores'), cores = last.cpu.cores;
  if (el.children.length !== cores.length) el.innerHTML = cores.map(() => '<div class="core"><b></b><span></span></div>').join('');
  cores.forEach((v, i) => {
    const c = el.children[i]; c.firstChild.style.height = Math.max(v, 1) + '%';
    c.lastChild.textContent = i; c.title = `CPU ${i}: ${v.toFixed(0)}%`;
  });
}

/* ---------- process table ---------- */
let sortK = store.get('sortK', 'cpu'), sortAsc = store.get('sortAsc', false), gpuOnly = false;
document.querySelectorAll('th').forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  if (sortK === k) sortAsc = !sortAsc; else { sortK = k; sortAsc = ['user', 'name', 'status', 'cmd', 'pid'].includes(k); }
  store.set('sortK', sortK); store.set('sortAsc', sortAsc); renderProcs();
});
$('q').oninput = () => renderProcs();
$('gpuonly').onclick = () => { gpuOnly = !gpuOnly; $('gpuonly').setAttribute('aria-pressed', String(gpuOnly)); renderProcs(); };
function renderProcs(){
  if (!last) return;
  document.querySelectorAll('th').forEach(th => { th.classList.toggle('s', th.dataset.k === sortK); th.classList.toggle('asc', th.dataset.k === sortK && sortAsc); });
  const f = $('q').value.trim().toLowerCase();
  let rows = last.procs.filter(p => (!gpuOnly || p.vram != null || p.gpu != null) &&
    (!f || p.name.toLowerCase().includes(f) || p.user.toLowerCase().includes(f) || String(p.pid) === f || p.cmd.toLowerCase().includes(f)));
  const d = sortAsc ? 1 : -1;
  rows.sort((a, b) => { const x = a[sortK] ?? -1, y = b[sortK] ?? -1; return (x < y ? -1 : x > y ? 1 : a.pid - b.pid) * d; });
  const total = rows.length; rows = rows.slice(0, MAXROWS);
  const ncpu = last.cpu.cores.length || 1, memT = last.mem.total, vramT = last.gpus.reduce((a, g) => a + g.vram_total, 0) || 1;
  const bar = (v, col) => `<span class="bar"><i style="width:${Math.min(100, Math.max(0, v)).toFixed(1)}%;background:var(${col})"></i></span>`;
  $('tb').innerHTML = rows.map(p => `<tr>
    <td>${p.pid}</td><td class="l">${esc(p.user)}</td><td class="l">${esc(p.name)}</td>
    <td>${bar(p.cpu / ncpu, '--c-cpu')}${p.cpu.toFixed(1)}</td>
    <td>${bar(p.mem / memT * 100, '--c-ram')}${fmtB(p.mem)}</td>
    <td>${p.vram == null ? '' : bar(p.vram / vramT * 100, '--c-vram') + fmtB(p.vram)}</td>
    <td>${p.gpu == null ? '' : bar(p.gpu, '--c-sm') + p.gpu}</td>
    <td class="l hide-sm">${esc(p.status)}</td><td class="l cmd hide-sm" title="${esc(p.cmd)}">${esc(p.cmd)}</td></tr>`).join('');
  $('pcount').textContent = `${total} processes${total > MAXROWS ? ` · showing ${MAXROWS}` : ''} · CPU % is per core (max ${ncpu * 100}%)`;
}

/* ---------- main render ---------- */
// Chart values for a snapshot (full /api/stats or trimmed /api/history point).
function values(s){
  const v = {cpu: s.cpu.total, mem: s.mem.used / s.mem.total * 100, memB: s.mem.used};
  if (s.mem.swap_total){ v.swap = s.mem.swap_used / s.mem.swap_total * 100; v.swapB = s.mem.swap_used; }
  for (const g of s.gpus){
    const k = 'g' + g.index;
    v[k + 'sm'] = g.sm; v[k + 'ten'] = g.tensor; v[k + 'pw'] = g.power_w;
    v[k + 'vr'] = g.vram_total ? g.vram_used / g.vram_total * 100 : null; v[k + 'vrB'] = g.vram_used;
  }
  return v;
}
function push(s){
  const v = values(s);
  if (s.ts > lastTs){
    H.push({t: s.ts, iv: s.interval, v}); lastTs = s.ts;
    while (H.length && H[0].t < s.ts - KEEP_MS) H.shift();
  }
  return v;
}
function render(s){
  last = s;
  $('host').textContent = s.hostname; document.title = s.hostname + ' · webtop';
  $('sub').textContent = `${fmtUp(s.uptime)} · load ${s.load.map(x => x.toFixed(2)).join(' ')}` + (s.interval < rate ? ` · sampling every ${fmtRate(s.interval)} (another viewer)` : '');
  const v = push(s);
  $('cpuv').textContent = pct(s.cpu.total);
  $('cpusub').textContent = `${s.cpu.brand} · ${s.cpu.cores.length} threads`;
  $('memv').textContent = pct(v.mem);
  $('memsub').textContent = `${fmtB(s.mem.used)} of ${fmtB(s.mem.total)}`;
  $('m-used').textContent = fmtB(s.mem.used);
  $('m-avail').textContent = fmtB(s.mem.available);
  $('m-swap').textContent = s.mem.swap_total ? `${fmtB(s.mem.swap_used)}` : 'none';
  $('swaplg').style.display = s.mem.swap_total ? '' : 'none';
  paintCores();
  s.gpus.forEach(renderGpu);
  drawAll();
  renderProcs();
}

async function tick(){
  timer = null;
  if (!paused && !document.hidden){
    try {
      const r = await fetch('api/stats?interval=' + rate, {cache: 'no-store'});
      if (r.ok){ const s = await r.json(); if (s.ts){ render(s); lastOk = Date.now(); } }
    } catch {}
  }
  const stale = !paused && Date.now() - lastOk > Math.max(rate * 4, 5000);
  $('dot').classList.toggle('off', stale);
  if (stale && lastOk) $('sub').textContent = 'disconnected — retrying…';
  if (!paused) timer = setTimeout(tick, rate);
}
function restart(){ if (timer) clearTimeout(timer); tick(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && !paused) restart(); });
// Backfill charts from the server's history so a reload doesn't start empty.
async function boot(){
  try {
    const r = await fetch('api/history', {cache: 'no-store'});
    if (r.ok) for (const p of await r.json()) push(p);
  } catch {}
  tick();
}
applyTheme();
boot();
</script>
